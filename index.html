<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- viewport-fit=cover is what makes env(safe-area-inset-*) report real values on a notched
     iPhone; without it they are all 0 and css/mobile.css cannot keep the controls clear of the
     home indicator. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Predictive Narrative — Daily Experience Simulator</title>
<script>
  /* index.html?view=mobile — the player's-eye view: the game window and nothing else.
     Inline, and in <head>, on purpose. Every other script in this project is at the end of
     <body> (and the board is a deferred module), which is at least one paint too late for a
     layout switch: the desktop view would flash first. Reading it here means the very first
     paint is already the right one.
     VIEW_MOBILE is a global the rest of the app can read — see css/mobile.css and the camera
     zoom in js/ui/board3d.js. */
  const VIEW_MOBILE = new URLSearchParams(location.search).get("view") === "mobile";
  if (VIEW_MOBILE) document.documentElement.classList.add("viewMobile");
</script>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/board.css">
<link rel="stylesheet" href="css/panels.css">
<link rel="stylesheet" href="css/drawer.css">
<link rel="stylesheet" href="css/overlay.css">
<link rel="stylesheet" href="css/library.css">
<!-- last, so its overrides win the cascade without needing specificity tricks -->
<link rel="stylesheet" href="css/mobile.css">
</head>
<body>
<div class="wrap">
  <!-- HUD -->
  <div class="hud">
    <div class="brand"><span class="k">Predictive Narrative</span><span class="t display">Harbour Heights</span></div>
    <div class="daychip"><span class="d" id="hDay">Day 1</span><span class="c" id="hClock">9:00 AM</span></div>
    <div class="pills">
      <div class="pill coins"><span class="ic"><img src="assets/ui/coin.png" alt="🪙"></span><div><div class="v" id="hCoins">0</div><div class="lb">Coins</div></div></div>
      <div class="pill"><span class="ic">🌟</span><div><div class="v" id="hVip">0</div><div class="lb">VIP Pool</div></div></div>
    </div>
    <!-- Player. Not changeable yet — it is the handle for the profile panel, which for now
         holds only the progress reset. Pushed to the far right so the balances read left. -->
    <button class="avatarBtn" id="avatarBtn" title="Player">💃</button>
  </div>

  <!-- stage -->
  <div class="stage">
    <button class="storeBtn" id="storeBtn">🛒 Store</button>
    <div class="boardScene" id="boardScene">
      <!-- WebGL board (js/ui/board3d.js) plus a DOM layer for crisp tile labels -->
      <div class="boardHost" id="boardHost"></div>
      <div class="boardLabels" id="boardLabels"></div>
      <!-- legacy CSS-3D board, used when cfg.board3d is 0 or WebGL is unavailable -->
      <div class="board" id="board">
        <div class="token" id="token"><div class="disc">💃</div></div>
      </div>
      <!-- win/loss reveal, sits flat above the 3D board -->
      <div class="centerfx" id="centerFx"></div>
      <!-- Reshoot mode (js/ui/fx.js showReshoot): the clapperboard that announces the delay,
           and the pink per-throw button that stands in for the playbar while the jail corner
           plays out. Static and EMPTY, like #centerFx and #bonusHost — fx.js fills it on the
           way in and empties it again on teardown, so nothing of the mode survives the beat.
           Inside the board scene so ?view=mobile frames it with the board. -->
      <div class="reshootUI" id="reshootUI"></div>
      <!-- Bonus mini-games (minigames/, js/ui/minigame.js) mount an iframe here. Inside the
           board scene rather than over the viewport, so ?view=mobile frames them like the
           board itself instead of escaping the 9:16 window. -->
      <div class="bonusHost" id="bonusHost"></div>
      <!-- In-scene modal host. The page-level .scrim is position:fixed and covers the whole
           viewport; a sheet mounted here is contained by the board window, so it frames like
           part of the game rather than like a website dialog over it. -->
      <div class="sheet" id="sheetHost"></div>
      <!-- Play controls ride ON the board as a flat 2D layer pinned to its bottom edge, so the
           scene reads as a game screen rather than a viewport with a toolbar under it. -->
      <!-- One row, evenly spaced: dice · library · stake · ROLL. The dice are hidden unless the
           3D pair can't take the throw (body.dice2d), so most of the time this reads as the
           three controls centred on the board's bottom edge. -->
      <div class="playbar">
        <div class="dice"><div class="die" id="die1"></div><div class="die" id="die2"></div></div>
        <!-- Library: every series, season and episode, and what the next one costs to unlock. -->
        <button class="btn ghost lib" id="libBtn" title="Library — what there is to unlock">🎞</button>
        <!-- Stake: one button that cycles through MULTIPLIERS and wraps back to ×1. -->
        <button class="btn mult" id="multBtn" title="Roll stake — tap to cycle">×1</button>
        <!-- Roll is also the auto-roll control: hold it to hand the loop over, tap again to stop. -->
        <button class="btn roll" id="rollBtn" title="Tap to roll · hold to auto-roll">🎲 Roll</button>
      </div>
    </div>
    <!-- second row: the view toggle. It used to share the row with the auto-play session
         button, which went with the builders it existed to buy. -->
    <div class="controls viewrow">
      <button class="btn ghost" id="phoneBtn" title="Toggle 9:16 phone framing">📱 Phone view</button>
    </div>
  </div>

  <!-- side -->
  <div class="side">
    <!-- Two stats, one row of the 2-column grid. Everything else that used to be counted here
         (episodes watched, prediction accuracy, streak, builders done) belonged to systems this
         version does not have — what is left is the run itself: how much was rolled, and when. -->
    <div class="card">
      <h3>📊 This run</h3>
      <div class="statgrid">
        <div class="stat"><div class="v" id="sRolls">0</div><div class="l">Total rolls</div></div>
        <div class="stat"><div class="v" id="sSessions">1</div><div class="l">Session today</div></div>
      </div>
    </div>

    <div class="card">
      <h3>📜 Activity</h3>
      <div class="log" id="log"></div>
    </div>
  </div>

  <!-- action bar -->
  <div class="actionbar">
    <button class="btn teal" id="nextBtn">⏭ Wait for full energy → next session</button>
    <span class="hint" id="nextHint"></span>
    <span class="sep"></span>
    <span class="hint">Editing any value in <b style="color:var(--purple)">Tuning</b> updates the sim live.</span>
  </div>
</div>

<button class="drawerBtn" id="drawerBtn">⚙ Tuning</button>

<!-- drawer -->
<div class="drawer" id="drawer">
  <div class="dh">
    <div><h2>Economy tuning</h2><p>Live values. Board layout is fixed to the 40-tile reference.</p></div>
    <button class="closeX" id="closeDrawer">✕</button>
  </div>
  <div class="body" id="tuningBody"></div>
</div>

<div class="scrim" id="scrim"></div>
<div class="toasts" id="toasts"></div>

<!-- Load order matters: each file only uses globals defined in files above it. -->
<script src="js/util.js"></script>
<script src="js/config.js"></script>
<script src="js/content.js"></script>

<!-- The catalog: what there is to unlock. One file per series and one per season, each
     registering itself into Catalog. The season file is the source of truth for an episode's
     title, video and price — episodes/NNN.js held that when an episode was a prediction, and
     is parked now that it isn't. -->
<script src="js/catalog.js"></script>
<script src="content/series/001.js"></script>
<script src="content/series/002.js"></script>
<script src="content/seasons/001-1.js"></script>
<script src="content/seasons/001-2.js"></script>
<script src="content/seasons/001-3.js"></script>
<script src="js/unlock.js"></script>

<!-- economy: the loaded model and its maths, the .xlsx reader, and the importer that gates it.
     After the episode files because the series shape is bounded by how much content exists. -->
<script src="js/xlsx.js"></script>
<script src="js/economy.js"></script>
<script src="js/economy-import.js"></script>
<script src="js/board-model.js"></script>
<script src="js/env-model.js"></script>
<script src="js/dice-model.js"></script>
<!-- environment placement manifest (see assets/env/ART-BRIEF-ENV.md) -->
<script src="assets/env/scene.js"></script>
<!-- who walks the board, and which way each one faces (see assets/npcs/README.md) -->
<script src="assets/npcs/npcs.js"></script>
<script src="js/state.js"></script>
<script src="js/storage.js"></script>
<script src="js/board-actor.js"></script>
<script src="js/tiles/tile.js"></script>
<script src="js/tiles/standard-tile.js"></script>
<script src="js/tiles/start-tile.js"></script>
<script src="js/tiles/spa-tile.js"></script>
<script src="js/tiles/vip-tile.js"></script>
<script src="js/tiles/reshoot-tile.js"></script>
<script src="js/tiles/deck-tile.js"></script>
<script src="js/tiles/payroll-tile.js"></script>
<script src="js/tiles/overheads-tile.js"></script>
<script src="js/overlays/overlay.js"></script>
<script src="js/overlays/mystery-box.js"></script>
<script src="js/game.js"></script>
<!-- The face of a drawn card, composed on a canvas. BEFORE fx.js, which drops that canvas into
     the DOM for the flat card; js/ui/shoe3d.js wraps the same canvas in a texture for the board.
     shoe3d.js itself gets NO tag — it is a module imported by js/ui/board3d.js, and this project
     keeps exactly one <script type="module"> so the classic order stays the dependency order. -->
<script src="js/ui/card-art.js"></script>
<script src="js/ui/fx.js"></script>
<!-- after fx.js: falls back to its showCollect() when a game is off, missing or broken -->
<script src="js/ui/minigame.js"></script>
<script src="js/ui/render.js"></script>
<!-- js/ui/prediction.js and finale.js are deliberately NOT loaded, and neither are
     js/episodes.js or episodes/NNN.js: the prediction system they belong to is gone and the
     season files in content/ own episode titles now. Nothing may call into them. -->
<script src="js/ui/profile.js"></script>
<script src="js/ui/store.js"></script>
<!-- The episode video player. Standalone: its only content dependency is Catalog.videoFor, and
     its CSS has always lived in css/overlay.css. Unparked now that unlocking an episode is also
     how you get to watch one. -->
<script src="js/ui/player.js"></script>
<script src="js/ui/library.js"></script>
<script src="js/ui/economy-panel.js"></script>
<script src="js/ui/drawer.js"></script>
<!-- The debug jumps. A development tool and nothing else: dropping this one tag removes the
     HUD button and every action with it, because the button is built in JS rather than declared
     here. See the file's header. -->
<script src="js/ui/debug.js"></script>
<script src="js/ui/main.js"></script>
<!-- three.js addons import the bare specifier "three"; this maps it to the vendored build -->
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>
<!-- ES module: runs after every classic script above, then calls boot(). Needs http, not file:// -->
<script type="module" src="js/ui/board3d.js"></script>
</body>
</html>
