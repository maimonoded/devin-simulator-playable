<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>The Premiere — Match 3 for Access</title>
<style>
  :root{
    --crimson:#7a0f24; --crimson-d:#520a18; --crimson-l:#a5183a;
    --gold:#f2c94c; --gold-d:#b8841c; --gold-dd:#8a5f10;
    --champagne:#ffe9a8; --cream:#fff6e6;
    --navy:#160a2e; --navy-l:#241340;
    --magenta:#e91e8c; --rosa:#ff7eb9;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
  html,body{height:100%;}
  body{
    font-family:"Trebuchet MS",system-ui,-apple-system,sans-serif;
    background:
      radial-gradient(130% 60% at 50% -8%, #a5183a 0%, #7a0f24 40%, #46081a 78%, #2a0510 100%);
    min-height:100%;display:flex;justify-content:center;color:var(--cream);overflow-x:hidden;
  }
  .serif{font-family:"Bodoni MT",Didot,"Playfair Display",Georgia,serif;}
  .deco-label{font-family:"Trebuchet MS",sans-serif;letter-spacing:.28em;text-transform:uppercase;}

  .stage{width:100%;max-width:440px;padding:14px 12px 30px;position:relative;}
  .stage.shake{animation:shake .45s;}
  @keyframes shake{0%,100%{transform:none}20%{transform:translate(-6px,2px)}40%{transform:translate(5px,-2px)}60%{transform:translate(-4px,1px)}80%{transform:translate(2px,0)}}

  /* ---- marquee arch frame ---- */
  .frame{
    position:relative;border-radius:26px 26px 20px 20px;padding:16px 14px 18px;
    background:
      linear-gradient(180deg, rgba(255,233,168,.10), rgba(0,0,0,.18)),
      linear-gradient(180deg, #8e1330 0%, #6d0c22 55%, #5a0a1c 100%);
    border:3px solid transparent;
    box-shadow:
      0 0 0 3px var(--gold-dd),
      0 0 0 6px var(--crimson-d),
      inset 0 2px 0 rgba(255,255,255,.12),
      0 24px 60px rgba(0,0,0,.55);
  }
  /* marquee bulbs */
  .bulbs{position:absolute;inset:-3px;border-radius:26px 26px 20px 20px;pointer-events:none;}
  .bulb{position:absolute;width:9px;height:9px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff7d6, var(--gold) 55%, var(--gold-d));
    box-shadow:0 0 7px 1px rgba(242,201,76,.85);}
  @keyframes twinkle{0%,100%{opacity:1;}50%{opacity:.35;}}

  /* ---- portrait medallion ---- */
  .marquee-top{text-align:center;position:relative;margin:4px 0 12px;}
  .sunburst{position:absolute;left:50%;top:34px;width:180px;height:180px;
    translate:-50% -50%;pointer-events:none;opacity:.5;
    background:conic-gradient(from 0deg, transparent 0 7deg, rgba(255,233,168,.5) 7deg 12deg, transparent 12deg 24deg);
    border-radius:50%;animation:spin 40s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .portrait{position:relative;width:82px;height:82px;margin:2px auto 0;border-radius:50%;
    background:radial-gradient(circle at 40% 35%, #3a1b4e, #1c0d2c);
    display:flex;align-items:center;justify-content:center;font-size:42px;
    border:4px solid var(--gold);box-shadow:0 0 0 3px var(--crimson-d),0 6px 16px rgba(0,0,0,.5),0 0 22px rgba(242,201,76,.4);}
  .plaque{display:inline-block;margin-top:10px;padding:6px 20px;border-radius:8px;position:relative;
    background:linear-gradient(180deg,#ffdf7a,var(--gold) 45%,var(--gold-d));
    box-shadow:0 3px 0 var(--gold-dd),0 6px 12px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.6);}
  .plaque .show{font-size:20px;font-weight:700;font-style:italic;color:#5a0a1c;line-height:1.05;
    text-shadow:0 1px 0 rgba(255,255,255,.35);}
  .plaque .sub{font-size:8.5px;color:#7a1226;font-weight:700;}
  .match-line{margin:14px 0 10px;text-align:center;font-size:13.5px;font-weight:700;color:var(--champagne);}
  .match-line .b{color:#fff;}

  /* ---- prize ladder (size scales with value) ---- */
  .ladder{display:flex;flex-direction:column;gap:9px;margin-bottom:15px;}
  .tier{display:flex;align-items:center;gap:9px;padding:8px 12px;border-radius:13px;
    background:linear-gradient(180deg, rgba(0,0,0,.28), rgba(0,0,0,.42));
    border:1.5px solid rgba(242,201,76,.35);transition:all .35s;}
  .tier .slots{display:flex;gap:6px;}
  .slot{border-radius:9px;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(180deg,#2a0a16,#1c0610);border:1.5px solid rgba(242,201,76,.25);
    filter:grayscale(1) brightness(.55);transition:all .3s;position:relative;}
  .slot.lit{filter:none;border-color:var(--gold);
    background:linear-gradient(180deg,#3a1250,#20103a);box-shadow:0 0 12px rgba(242,201,76,.55);animation:slotpop .3s;}
  @keyframes slotpop{40%{transform:scale(1.22);}}
  /* tier size classes */
  .tier.small .slot{width:38px;height:38px;font-size:22px;}
  .tier.big .slot{width:50px;height:50px;font-size:30px;}
  .tier.huge .slot{width:64px;height:64px;font-size:40px;}
  .tier .pay{margin-left:auto;text-align:right;}
  .tier .pay .amt{font-family:"Bodoni MT",Georgia,serif;font-weight:700;color:var(--champagne);line-height:1;}
  .tier.small .pay .amt{font-size:18px;}
  .tier.big .pay .amt{font-size:22px;}
  .tier .pay .cat{font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--rosa);margin-bottom:3px;}
  .tier.small .pay .cat{font-size:8.5px;}
  .tier.huge{border-color:rgba(242,201,76,.7);border-width:2px;
    background:linear-gradient(180deg, rgba(242,201,76,.16), rgba(0,0,0,.4));
    box-shadow:inset 0 0 18px rgba(242,201,76,.12);}
  .tier.huge .pay .amt{color:var(--gold);font-size:27px;}
  .tier.huge .pay .cat{color:var(--gold);font-size:10.5px;}
  .tier.won{border-color:var(--gold);box-shadow:0 0 24px rgba(242,201,76,.5);transform:scale(1.03);
    background:linear-gradient(180deg, rgba(242,201,76,.22), rgba(0,0,0,.3));}
  .tier.faded{opacity:.32;}

  /* ---- vault grid ---- */
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;
    padding:12px 11px;border-radius:16px;
    background:
      repeating-linear-gradient(135deg, rgba(0,0,0,.08) 0 8px, rgba(0,0,0,.14) 8px 16px),
      linear-gradient(180deg,#8e1330,#6d0c22);
    box-shadow:inset 0 2px 8px rgba(0,0,0,.5),inset 0 0 0 2px rgba(242,201,76,.25);}
  .cell{aspect-ratio:.82;border-radius:11px;cursor:pointer;position:relative;
    transform-style:preserve-3d;transition:transform .15s;}
  .cell:active:not(.open){transform:scale(.94);}
  .cell .face{position:absolute;inset:0;border-radius:11px;display:flex;align-items:center;justify-content:center;
    backface-visibility:hidden;overflow:hidden;}
  /* envelope (closed) */
  .env{background:linear-gradient(180deg,#fff6e6,#ecd7b4);
    border:2px solid var(--gold-d);box-shadow:inset 0 2px 0 rgba(255,255,255,.7),0 3px 7px rgba(0,0,0,.4);}
  .env::before{content:"";position:absolute;top:0;left:0;right:0;height:56%;
    background:linear-gradient(180deg,#fbeccb,#efd9b3);
    clip-path:polygon(0 0,100% 0,50% 100%);border-bottom:2px solid rgba(184,132,28,.4);}
  .env .seal{position:relative;z-index:2;width:26px;height:26px;border-radius:50%;margin-top:14%;
    background:radial-gradient(circle at 38% 32%,#ff5a7e,var(--magenta) 60%,#a80f52);
    display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;
    box-shadow:0 2px 5px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.4);}
  .cell:hover .env{filter:brightness(1.05);}
  /* opened interior */
  .open-face{background:radial-gradient(circle at 50% 45%, #2c1550, var(--navy) 70%);
    border:2px solid var(--gold);box-shadow:inset 0 0 14px rgba(0,0,0,.6),0 0 16px rgba(242,201,76,.35);
    transform:rotateY(180deg);}
  .rays{position:absolute;inset:-30%;
    background:conic-gradient(from 0deg,
      rgba(255,233,168,.0) 0 6deg, rgba(255,233,168,.55) 6deg 12deg,
      rgba(255,233,168,0) 12deg 24deg);animation:spin 12s linear infinite;}
  .prize{position:relative;z-index:2;font-size:52px;filter:drop-shadow(0 3px 8px rgba(0,0,0,.6)) drop-shadow(0 0 12px rgba(242,201,76,.7));
    animation:prizein .4s cubic-bezier(.2,1.5,.4,1);}
  @keyframes prizein{from{transform:scale(0) rotate(-40deg);}to{transform:scale(1) rotate(0);}}
  .cell.flip{transform:rotateY(180deg);}
  .cell.win-glow .open-face{box-shadow:inset 0 0 14px rgba(0,0,0,.5),0 0 26px rgba(242,201,76,.9);border-color:#fff;}

  /* ---- stage floor loot ---- */
  .floor{display:flex;justify-content:center;gap:4px;font-size:30px;margin-top:12px;
    filter:drop-shadow(0 6px 6px rgba(0,0,0,.5));opacity:.92;}
  .floor span:nth-child(odd){transform:translateY(4px);}

  /* ---- loading: private jet flight ---- */
  .loader{position:fixed;inset:0;z-index:300;display:flex;flex-direction:column;align-items:center;justify-content:center;
    overflow:hidden;
    background:linear-gradient(180deg,#ff9a5a 0%,#e2637a 32%,#8e2b6e 62%,#3a1250 100%);}
  .loader.hide{animation:loaderOut .6s ease forwards;}
  @keyframes loaderOut{to{opacity:0;visibility:hidden;}}
  .l-sun{position:absolute;top:34%;left:50%;transform:translateX(-50%);width:130px;height:130px;border-radius:50%;
    background:radial-gradient(circle,#fff3c0 0%,#ffd166 45%,rgba(255,209,102,0) 72%);filter:blur(2px);}
  .l-cloud{position:absolute;font-size:44px;opacity:.85;filter:drop-shadow(0 6px 10px rgba(0,0,0,.15));
    animation:cloudBy linear infinite;}
  @keyframes cloudBy{from{transform:translateX(115vw);}to{transform:translateX(-45vw);}}
  .l-jetwrap{position:relative;z-index:5;display:flex;align-items:center;justify-content:center;}
  .l-jet{font-size:80px;filter:drop-shadow(0 10px 16px rgba(0,0,0,.35));
    animation:jetBob 2.4s ease-in-out infinite;}
  @keyframes jetBob{0%,100%{transform:translateY(0) rotate(-4deg);}50%{transform:translateY(-14px) rotate(-1deg);}}
  .l-trail{position:absolute;top:50%;right:calc(50% + 34px);height:9px;width:46vw;z-index:4;
    background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.85));border-radius:999px;
    transform:translateY(-8px);filter:blur(1px);animation:trailPulse 1.6s ease-in-out infinite;}
  @keyframes trailPulse{50%{opacity:.5;}}
  .l-text{position:relative;z-index:6;margin-top:24px;text-align:center;}
  .l-text .eyebrow{font-size:10px;letter-spacing:.42em;text-transform:uppercase;color:rgba(255,255,255,.85);}
  .l-text h1{font-family:"Bodoni MT",Didot,Georgia,serif;font-style:italic;font-size:34px;font-weight:700;
    color:#fff;text-shadow:0 3px 14px rgba(0,0,0,.35);margin:6px 0 2px;}
  .l-text .dest{font-size:13px;color:rgba(255,255,255,.9);font-weight:600;}
  .l-dots{display:flex;gap:8px;margin-top:20px;z-index:6;}
  .l-dots span{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.4);animation:dotp 1.2s ease-in-out infinite;}
  .l-dots span:nth-child(2){animation-delay:.2s;}
  .l-dots span:nth-child(3){animation-delay:.4s;}
  @keyframes dotp{0%,100%{opacity:.35;transform:scale(.85);}50%{opacity:1;transform:scale(1.2);background:#fff;}}

  .hud{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;padding:0 2px;}
  .coins{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.35);border:1.5px solid rgba(242,201,76,.5);
    border-radius:999px;padding:7px 14px;font-weight:800;font-size:15px;color:var(--champagne);}
  .coins.bump{animation:bump .45s;}
  @keyframes bump{40%{transform:scale(1.16);}100%{transform:scale(1);}}
  .hint{font-size:11px;color:rgba(255,246,230,.6);}

  /* float labels + confetti */
  .float{position:fixed;z-index:80;pointer-events:none;font-weight:900;font-size:22px;color:var(--gold);
    text-shadow:0 2px 10px rgba(0,0,0,.9);transform:translate(-50%,-50%);white-space:nowrap;animation:fu 1.4s ease forwards;}
  @keyframes fu{0%{opacity:0;margin-top:8px}15%{opacity:1}80%{opacity:1;margin-top:-40px}100%{opacity:0;margin-top:-56px}}
  .conf{position:fixed;z-index:75;width:11px;height:16px;pointer-events:none;}

  /* ---- collect tray (in-place, bottom) ---- */
  .tray{margin-top:44px;border-radius:18px;padding:34px 16px 16px;text-align:center;position:relative;
    background:linear-gradient(180deg,#fff6e6,#f0dcc0);
    border:3px solid var(--gold);box-shadow:0 0 0 2px var(--crimson-d),0 -6px 24px rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.7);
    max-height:0;opacity:0;overflow:visible;transition:none;}
  .tray.show{max-height:340px;opacity:1;animation:trayUp .5s cubic-bezier(.2,1.3,.4,1);}
  @keyframes trayUp{from{transform:translateY(30px);opacity:0;}to{transform:none;opacity:1;}}
  /* rival profile avatar, overlapping the top edge */
  .tray .rival-pic{position:absolute;top:-40px;left:50%;transform:translateX(-50%);width:76px;height:76px;border-radius:50%;
    background:radial-gradient(circle at 40% 35%,#5a3b6e,#2a1638);display:flex;align-items:center;justify-content:center;font-size:38px;
    border:4px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.4);z-index:3;overflow:hidden;}
  .tray .rival-pic .cry{position:absolute;bottom:6px;right:6px;font-size:20px;}
  .tray .won-for{font-size:15px;color:#7a1226;font-weight:700;line-height:1.4;}
  .tray .won-for b{color:#5a0a1c;font-family:"Bodoni MT",Georgia,serif;font-style:italic;font-size:19px;font-weight:700;}
  .tray .won-cat{display:inline-block;margin:1px 0 8px;font-family:"Bodoni MT",Georgia,serif;font-style:italic;
    font-size:16px;font-weight:700;color:#8e1330;}
  .tray .won-amt{display:flex;align-items:center;justify-content:center;gap:8px;margin:2px 0 6px;padding:8px 12px;
    border-radius:12px;background:linear-gradient(180deg,#fbeccb,#efd9b3);border:2px solid var(--gold-d);
    font-family:"Bodoni MT",Georgia,serif;font-weight:700;font-size:32px;color:#8a5f10;
    text-shadow:0 1px 0 rgba(255,255,255,.6);box-shadow:inset 0 1px 3px rgba(0,0,0,.15);}
  .tray .won-amt .t{font-size:28px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.3));}
  /* their loss caption */
  .tray .their-loss{font-size:12px;color:#9a4a2a;font-weight:700;margin:8px 0 12px;line-height:1.35;}
  .tray .their-loss .amt{color:#c0392b;}
  .tray .their-loss .why{display:block;font-size:11px;color:#8a5a3a;font-weight:600;font-style:italic;margin-top:1px;}
  .collect-btn{width:100%;border:none;border-radius:999px;padding:15px;font-size:18px;font-weight:800;cursor:pointer;
    font-family:inherit;letter-spacing:.06em;text-transform:uppercase;
    background:linear-gradient(180deg,#7bd66a,#3fa832 55%,#2c7d22);color:#fff;
    box-shadow:0 4px 0 #205c18,0 6px 14px rgba(0,0,0,.3);text-shadow:0 1px 1px rgba(0,0,0,.25);}
  .collect-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #205c18;}
  .collect-btn.pulse{animation:cbpulse 1.4s ease-in-out infinite;}
  @keyframes cbpulse{50%{filter:brightness(1.1);transform:scale(1.015);}}

  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="loader" id="loader">
  <div class="l-sun"></div>
  <div class="l-cloud" style="top:22%;animation-duration:3.4s;">☁️</div>
  <div class="l-cloud" style="top:58%;animation-duration:2.6s;animation-delay:.6s;font-size:34px;">☁️</div>
  <div class="l-cloud" style="top:70%;animation-duration:4s;animation-delay:1.1s;">🌥️</div>
  <div class="l-jetwrap">
    <div class="l-trail"></div>
    <div class="l-jet">🛩️</div>
  </div>
  <div class="l-text">
    <div class="eyebrow">Now boarding</div>
    <h1>Off to the Premiere</h1>
    <div class="dest" id="loaderDest">Fueling the jet…</div>
  </div>
  <div class="l-dots"><span></span><span></span><span></span></div>
</div>

<div class="stage" id="stage">
  <div class="hud">
    <div class="hint deco-label" style="font-size:9px;">Rare · The Airplane</div>
    <div class="coins" id="coinPill"><span>🪙</span><span id="coinVal">5,000</span></div>
  </div>

  <div class="frame">
    <div class="bulbs" id="bulbs"></div>

    <div class="marquee-top">
      <div class="sunburst"></div>
      <div class="portrait" id="portrait">🎭</div>
      <div class="plaque">
        <div class="show serif" id="showName">Tonight's Premiere</div>
        <div class="sub deco-label">get closer than any other fan</div>
      </div>
    </div>

    <div class="match-line deco-label">Match <span class="b">3</span> to grab the access</div>

    <div class="ladder" id="ladder"></div>

    <div class="grid" id="grid"></div>

    <div class="floor">🎟️ 🥂 📸 🌹 🥂 🎟️</div>

    <div class="tray" id="tray">
      <div class="rival-pic" id="rivalPic">🧑‍🎤<span class="cry">😭</span></div>
      <div class="won-for">You beat <b id="rivalName">Meghan</b> to it<br>you scored <span class="won-cat" id="wonCat"></span></div>
      <div class="won-amt"><span class="t" id="wonT">🪙</span><span id="wonAmt"></span></div>
      <div class="their-loss" id="theirLoss"></div>
      <button class="collect-btn pulse" id="collectBtn">Collect</button>
    </div>
  </div>
</div>

<script>
/* ============================================================
   THE PREMIERE — the train tile's LARGE bonus game.

   Two ways to run:
     hosted     — inside Harbour Heights. js/ui/minigame.js posts "bonus:open" carrying the prize
                  ladder the engine built and the rung it already paid; this page reveals that
                  result and posts "bonus:done" on Collect. It never decides money.
     standalone — opened directly (http://localhost:8125/minigames/gala-match3.html). No host
                  message arrives, so it invents a ladder and loops forever, for authoring.
   The contract is in minigames/README.md.

   THE RIGGED DECK, stated plainly: the engine picks the winning rung before this page opens, so
   the envelopes cannot be a fair shuffle — a fair shuffle would let a different symbol reach
   three first and pay a number nobody banked. Symbols are therefore assigned in the order cells
   are OPENED, from a plan that gives the target its third match last and caps every other symbol
   at two. The player chooses which envelope and how long it takes; the prize was already theirs.
   No global leaks to worry about: this page is its own realm inside the iframe.
   ============================================================ */

/* ---- host protocol ---- */
const HOST = window.parent !== window;
let SPEC = {                      // demo defaults; a hosted run overwrites these
  amount:0, label:"", coins:5000, loadMs:2500, idleMs:0, trayMs:14000,
  tiers:null, winIndex:null,
};
let demoMode = !HOST, started = false, sent = false;
function sendDone(amount){
  if(sent || !HOST) return;
  sent = true;
  parent.postMessage({type:"bonus:done", amount}, location.origin);
}

let coins=SPEC.coins;
const $=id=>document.getElementById(id);
const fmt=n=>Math.round(n).toLocaleString('en-US');
const shuf=a=>[...a].sort(()=>Math.random()-.5);
const rnd=a=>a[Math.floor(Math.random()*a.length)];
function setCoinsDisplay(v){$('coinVal').textContent=fmt(v);}
function shakeStage(){const s=$('stage');s.classList.remove('shake');void s.offsetWidth;s.classList.add('shake');}

/* every pending timeout, so an idle round or a host teardown never leaves one firing */
const shots=[];
function shot(ms,fn){ shots.push(setTimeout(fn,ms)); }
function clearShots(){ shots.forEach(clearTimeout); shots.length=0; }

/* sound */
let AC=null;
function tq(f,t,dur=.12,vol=.14,type='triangle'){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();
  const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.value=vol;
  g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+t+dur);o.connect(g);g.connect(AC.destination);
  o.start(AC.currentTime+t);o.stop(AC.currentTime+t+dur);}catch(e){}}
const S={open(){tq(680,0,.06,.09,'square');tq(340,0,.12,.06,'sine');},
  small(){[523,659].forEach((f,i)=>tq(f,i*.09,.14));},
  big(){[523,659,784,1047].forEach((f,i)=>tq(f,i*.09,.16,.15));},
  huge(){[523,659,784,1047,1319,1568].forEach((f,i)=>tq(f,i*.1,.2,.16));}};

/* marquee bulbs around the frame */
function placeBulbs(){
  const box=$('bulbs');box.innerHTML='';
  const W=box.clientWidth,H=box.clientHeight,step=26;
  const put=(x,y,i)=>{const b=document.createElement('div');b.className='bulb';
    b.style.left=(x-4.5)+'px';b.style.top=(y-4.5)+'px';
    b.style.animation=`twinkle ${1.6+Math.random()}s ease-in-out ${i*0.08}s infinite`;box.appendChild(b);};
  let i=0;
  for(let x=14;x<W-10;x+=step){put(x,6,i++);put(x,H-6,i++);}
  for(let y=20;y<H-14;y+=step){put(8,y,i++);put(W-8,y,i++);}
}

/* ---- the prize ladder ----
   Three rungs, ASCENDING, matching SPEC.tiers index for index. Only the theming lives here; the
   amounts are the engine's. lossFrac is the rival's consolation as a fraction of the win, so the
   caption scales with the real prize instead of quoting thousands next to a win of 105. */
const TIERS=[
  {sym:'⭐', cat:'Front-Row Seat',  size:'small', lossFrac:[0.12,0.22],
   why:['stuck in the back row','missed the entrance','a blocked-view seat']},
  {sym:'🎭', cat:'Backstage Pass',  size:'big',   lossFrac:[0.14,0.24],
   why:['couldn\'t get backstage','missed the cast meet-up','kept behind the barrier']},
  {sym:'🎟️', cat:'The After-Party', size:'huge',  lossFrac:[0.16,0.28],
   why:['stuck outside the velvet rope','left off the guest list','turned away at the door']},
];
const RIVAL_NAMES=['Meghan','PeterCrouch108','Valadon','sofia_r','DiegoM','TheReelQueen','marcopolo22','Bibi★','LunaDrama','xX_Novela_Xx'];
const RIVAL_PICS=['🧑‍🎤','👩‍🎤','🧔','👩‍🦰','🕵️','💁‍♀️','🧑‍🦱','👨‍🎨'];
const SHOWS=['Tonight\'s Premiere','The Season Finale','A Secret Wedding','Midnight in Marbella','The Reunion'];
const STARS=['💃','🕴️','👰','🤵','🎭'];

let amounts,plan,planAt,found,done,pendingWin,rival,winIdx;
let idleTimer=null;
/* How long the balance takes to count up on Collect. sendDone() waits longer than this — see
   collectWin(). */
const COUNT_MS=700;

/* The reveal plan: the order symbols come out of the envelopes.
   Exactly three of the target, its third at the very end, and never three of anything else. */
function buildPlan(target){
  const others=TIERS.map((t,i)=>i).filter(i=>i!==target);
  const N=4+Math.floor(Math.random()*4);              // 4..7 envelopes before the win
  const pool=[...others,...others];                   // two of each loser, never a third
  const head=shuf([target,target,...shuf(pool).slice(0,N-3)]);
  return [...head,target];
}

function renderLadder(){
  $('ladder').innerHTML=TIERS.map((t,i)=>`
    <div class="tier ${t.size}" id="t${i}">
      <div class="slots">
        <div class="slot" id="s${i}_0">${t.sym}</div>
        <div class="slot" id="s${i}_1">${t.sym}</div>
        <div class="slot" id="s${i}_2">${t.sym}</div>
      </div>
      <div class="pay"><div class="cat">${t.cat}</div><div class="amt">🪙 ${fmt(amounts[i])}</div></div>
    </div>`).join('');
}

function newGala(){
  $('tray').classList.remove('show');
  /* Demo mode has no engine, so it invents a top rung and applies the same thirds rule. */
  if(demoMode){
    const top=Math.round((1500+Math.random()*4000)/100)*100;
    amounts=[Math.round(top/3),Math.round(top*2/3),top];
    winIdx=Math.floor(Math.random()*3);
  }else{
    amounts=SPEC.tiers; winIdx=SPEC.winIndex;
  }
  plan=buildPlan(winIdx); planAt=0;
  found=TIERS.map(()=>0);
  done=false;pendingWin=null;
  rival={name:rnd(RIVAL_NAMES),pic:rnd(RIVAL_PICS)};
  $('showName').textContent=rnd(SHOWS);
  $('portrait').textContent=rnd(STARS);
  renderLadder();
  const grid=$('grid');grid.innerHTML='';
  for(let i=0;i<12;i++){
    const cell=document.createElement('div');cell.className='cell';
    cell.innerHTML=`
      <div class="face env"><div class="seal">✦</div></div>
      <div class="face open-face"><div class="rays"></div><div class="prize" style="visibility:hidden"></div></div>`;
    cell.addEventListener('click',()=>openCell(cell));
    grid.appendChild(cell);
  }
  requestAnimationFrame(placeBulbs);
  armIdle();
}

/* Opening envelopes is the player's decision and is never made for them, however long they take.
   Only auto-roll sends idleMs, because there is nobody at the keyboard. */
function armIdle(){
  clearTimeout(idleTimer);
  if(!SPEC.idleMs) return;
  idleTimer=setTimeout(function tick(){
    if(done) return;
    const shut=[...$('grid').children].filter(c=>!c.classList.contains('open'));
    if(shut.length) openCell(rnd(shut));
    if(!done) idleTimer=setTimeout(tick,420);
  },SPEC.idleMs);
}

function confettiBurst(n=60){
  const cols=['#f2c94c','#e91e8c','#ff7eb9','#8fd9ff','#fff6e6','#5ad19a'];
  for(let i=0;i<n;i++){
    const c=document.createElement('div');c.className='conf';
    c.style.background=cols[i%cols.length];
    c.style.left=(50+(Math.random()-.5)*40)+'%';c.style.top='30%';
    c.style.borderRadius=Math.random()<.5?'50%':'2px';
    document.body.appendChild(c);
    const dx=(Math.random()-.5)*400, dy=300+Math.random()*400, rot=Math.random()*720;
    c.animate([{transform:'translate(0,0) rotate(0)',opacity:1},
      {transform:`translate(${dx}px,${dy}px) rotate(${rot}deg)`,opacity:0}],
      {duration:1400+Math.random()*800,easing:'cubic-bezier(.2,.6,.4,1)'}).onfinish=()=>c.remove();
  }
}

function openCell(cell){
  if(done||cell.classList.contains('open'))return;
  cell.classList.add('open','flip');
  const idx=plan[planAt++];                 // the plan decides, not the cell
  const t=TIERS[idx];
  cell.dataset.tier=idx;
  const prize=cell.querySelector('.prize');
  prize.textContent=t.sym; prize.style.visibility='visible';
  S.open();
  const n=found[idx]++;
  const slot=$('s'+idx+'_'+n);if(slot)slot.classList.add('lit');
  if(found[idx]!==3) return;

  done=true;clearTimeout(idleTimer);
  pendingWin={idx,amount:amounts[idx]};
  TIERS.forEach((_,i)=>$('t'+i).classList.add(i===idx?'won':'faded'));
  [...$('grid').children].forEach(c=>{ if(+c.dataset.tier===idx) c.classList.add('win-glow'); });
  idx===2?S.huge():(idx===1?S.big():S.small());

  /* The rival's loss is flavour only — no economy touches it — but it is scaled to the prize so
     it never quotes a bigger number than the player just won. */
  const L=t.lossFrac, loss=Math.max(1,Math.round(amounts[idx]*(L[0]+Math.random()*(L[1]-L[0]))));
  $('rivalPic').innerHTML=rival.pic+'<span class="cry">😭</span>';
  $('rivalName').textContent=rival.name;
  $('wonCat').textContent=t.cat;
  $('wonT').textContent=t.sym;
  $('wonAmt').textContent=fmt(amounts[idx]);
  $('theirLoss').innerHTML=`They dropped <span class="amt">🪙 ${fmt(loss)}</span> trying
    <span class="why">${rnd(t.why)}</span>`;
  shot(500,()=>{
    $('tray').classList.add('show');
    $('tray').scrollIntoView({behavior:'smooth',block:'end'});
    /* Don't sit on the tray forever — collecting is an acknowledgement, not a decision. */
    shot(Math.max(3000,SPEC.trayMs*0.5),()=>{ if(pendingWin) collectWin(); });
  });
}

function collectWin(){
  if(!pendingWin)return;
  const win=pendingWin;pendingWin=null;
  clearShots();clearTimeout(idleTimer);
  const btn=$('collectBtn');btn.classList.remove('pulse');
  confettiBurst(win.idx===2?90:55);
  shakeStage();
  win.idx===2?S.huge():S.big();
  const start=coins,target=coins+win.amount,t0=performance.now();
  (function up(t){const k=Math.min(1,(t-t0)/COUNT_MS);
    coins=Math.round(start+(target-start)*(1-Math.pow(1-k,3)));setCoinsDisplay(coins);
    if(k<1)requestAnimationFrame(up);else{coins=target;setCoinsDisplay(coins);}
  })(t0);
  const p=$('coinPill');p.classList.remove('bump');void p.offsetWidth;p.classList.add('bump');
  $('tray').classList.remove('show');
  /* Hosted, the round IS the bonus — hand the roll loop back. The demo deals another. */
  if(demoMode) setTimeout(()=>{btn.classList.add('pulse');newGala();},900);
  /* Longer than the 700ms count-up above, deliberately: reporting done tears this frame down, and
     the rAF driving the tween dies with it — at 620ms the balance visibly froze mid-count. */
  else setTimeout(()=>sendDone(win.amount),COUNT_MS+220);
}

/* private-jet loading screen, then the first gala */
function runLoader(ms){
  const dests=['Grabbing your fan pass…','Following the limos…','Arriving at the red carpet…'];
  let i=0;const dl=$('loaderDest');
  const step=Math.max(200,ms/dests.length);
  const iv=setInterval(()=>{i++;if(i<dests.length)dl.textContent=dests[i];},step);
  setTimeout(()=>{
    clearInterval(iv);
    const l=$('loader');l.classList.add('hide');
    setTimeout(()=>{l.style.display='none';},600);
    newGala();
  },ms);
}

addEventListener('resize',()=>requestAnimationFrame(placeBulbs));
$('collectBtn').addEventListener('click',collectWin);

/* ---- start ----
   Hosted: hold on the loader until the engine's ladder arrives, so no rung is ever drawn before
   the payout is known. Standalone: start straight away in demo mode. */
function start(){ if(started) return; started=true; setCoinsDisplay(coins); runLoader(SPEC.loadMs); }
if(HOST){
  document.body.classList.add('hosted');
  addEventListener('message',e=>{
    if(e.origin!==location.origin||e.source!==parent) return;
    const m=e.data||{};
    if(m.type!=="bonus:open"||started) return;
    SPEC=Object.assign({},SPEC,m);
    /* A ladder is required. Without one there is nothing honest to show, so fall back to the
       demo rather than invent amounts the engine did not pay. */
    if(Array.isArray(SPEC.tiers)&&SPEC.tiers.length===3&&SPEC.winIndex!=null) demoMode=false;
    coins=SPEC.coins;
    start();
  });
  parent.postMessage({type:"bonus:ready"},location.origin);
  /* If the host never answers, don't leave a dead screen. It has its own guard and pays through
     the Collect popup, so this is only about not showing a frozen jet. */
  setTimeout(()=>{ if(!started){ demoMode=true; start(); } },4000);
}else{
  start();
}
</script>
</body>
</html>
