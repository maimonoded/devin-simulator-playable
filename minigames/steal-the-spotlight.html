<style>
  :root{
    --gold:#f2c94c; --gold-d:#b8841c; --champagne:#ffe9a8; --cream:#fff6e6;

  .l-cloud{position:absolute;font-size:44px;opacity:.85;filter:drop-shadow(0 6px 10px rgba(0,0,0,.15));

  .l-trail{position:absolute;top:50%;right:calc(50% + 34px);height:9px;width:46vw;z-index:4;

  .banner{position:absolute;top:16%;left:0;right:0;text-align:center;z-index:65;pointer-events:none;

  .polaroid{position:absolute;z-index:62;width:96px;padding:6px 6px 20px;background:#fff;

  .tray .rival-pic{position:absolute;top:-34px;left:50%;transform:translateX(-50%);width:66px;height:66px;border-radius:50%;

</style>

<body>

<script type="module">
/* ============================================================
   STEAL THE SPOTLIGHT — the train tile's SMALL bonus game.

   Two ways to run:
     hosted     — inside Harbour Heights. js/ui/minigame.js posts "bonus:open" with the payout
                  the engine has ALREADY banked; this page only presents it, and posts
                  "bonus:done" when the player collects. It never decides money.
     standalone — opened directly (http://localhost:8125/minigames/steal-the-spotlight.html).
                  No host message arrives, so it falls back to DEMO_CHECKS and plays forever.
                  That is deliberate: these games are authored and tuned on their own.
   The contract is written down in minigames/README.md.

   A module, not a classic script: the app it is embedded in shares one global namespace, and
   this file wants names ($, fmt, scene, camera, renderer, coins) that are already taken there.
   ============================================================ */
import * as THREE from "three";

/* ---- host protocol ---- */
const HOST = window.parent !== window;
/* Named SPEC, not cfg: `cfg` is already this file's name for a per-building config object
   (bTower(cfg), and the local in pick()), and one shadowing the other would be a silent bug. */
let SPEC = {                      // demo defaults; a hosted run overwrites these
  /* idleMs 0 = never pick for the player. Only auto-roll sends a value, because there is nobody
     at the keyboard to choose. trayMs paces the Collect tray, which is an acknowledgement rather
     than a decision — the coins are banked before the game even opens. */
  amount: 0, outcome: "win", label: "", coins: 5000, loadMs: 2500, idleMs: 0, trayMs: 14000,
};
let demoMode = !HOST;
const DEMO_CHECKS = [4200, 5000, 6000, 7500], DEMO_CONSOLATION = 350;
let sent = false;
function sendDone(amount){
  if(sent || !HOST) return;
  sent = true;
  parent.postMessage({type:"bonus:done", amount}, location.origin);
}

let coins = SPEC.coins;
const $ = id => document.getElementById(id);
const fmt = n => Math.round(n).toLocaleString('en-US');
const rnd = a => a[Math.floor(Math.random()*a.length)];
const stageWrap = $('stageWrap');
function setCoinsDisplay(v){$('coinVal').textContent=fmt(v);}
function bumpCoins(){const p=$('coinPill');p.classList.remove('bump');void p.offsetWidth;p.classList.add('bump');}
function shakeScreen(){stageWrap.classList.remove('shake');void stageWrap.offsetWidth;stageWrap.classList.add('shake');}
function flash(o=.5){const f=$('flash');f.style.transition='none';f.style.opacity=o;
  requestAnimationFrame(()=>{f.style.transition='opacity .4s';f.style.opacity=0;});}

let AC=null;
function tq(f,t,dur=.12,vol=.14,type='triangle'){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();
  const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.value=vol;
  g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+t+dur);o.connect(g);g.connect(AC.destination);
  o.start(AC.currentTime+t);o.stop(AC.currentTime+t+dur);}catch(e){}}
function shutter(){tq(1500,0,.03,.09,'square');tq(600,.02,.04,.07,'square');}
const S={tap(){tq(620,0,.06,.1,'triangle');},
  knock(){tq(200,0,.05,.12,'square');tq(200,.12,.05,.12,'square');},
  win(){[523,659,784,1047].forEach((f,i)=>tq(f,i*.09,.16,.15));},
  big(){[523,659,784,1047,1319].forEach((f,i)=>tq(f,i*.1,.18,.16));},
  block(){tq(300,0,.08,.1,'square');tq(520,.08,.14,.1,'square');tq(660,.18,.18,.1,'square');}};

/* ============================================================
   MONOPOLY-GO STYLE BOARD VIEW
   • tilted-down 3/4 camera, slight yaw
   • ground extends past LEFT/RIGHT/BOTTOM edges (never ends)
   • only the TOP shows a horizon: hazy skyline + sky + clouds
   • the 5 targets are clustered center-frame, dense dressing
   ============================================================ */
/* This scene was authored against three r128, which had no colour management and the old
   "legacy lights" falloff. The vendored build is r169, where both defaults changed: colours are
   converted to sRGB on output and light intensity is physical. Turning colour management off and
   scaling the lights by PI reproduces the r128 image on r169 rather than re-grading the art. */
THREE.ColorManagement.enabled = false;
const LIGHT_SCALE = Math.PI;
/* Breathing room between the banner and the highest target reticle. See fitTargetsBelowBanner(). */
const TOP_CLEARANCE_PX = 14;
/* How far above a building's roof its reticle reaches: it floats at +1.4 and the halo's radius is
   1.5, plus the idle bob. This is the point that actually has to clear the banner. */
const RETICLE_REACH = 3.1;

const wrapEl=$('wrap');
const SKY=0x87cdf5;
const scene=new THREE.Scene();
scene.background=new THREE.Color(SKY);
scene.fog=new THREE.Fog(0xbfdcee,46,74);   // far ground fades into haze near the horizon

let camera;
const HALF_W=10;                             // the scene is framed by width
/* Vertical pan, in world units. Shifting the orthographic window UP slides the world DOWN the
   screen by the same amount — which is how the target cluster is kept out from behind the
   banner. Set by fitTargetsBelowBanner(), which measures the deficit rather than assuming one. */
let camShift=0;
function mkCam(){
  const W=stageWrap.clientWidth||innerWidth,H=stageWrap.clientHeight||innerHeight;const a=W/H;
  const halfH=HALF_W/a;
  camera=new THREE.OrthographicCamera(-HALF_W,HALF_W,halfH+camShift,-halfH+camShift,1,300);
  camera.position.set(7,30,36);camera.lookAt(0,1,-4);   // ~40° down, slight yaw
  /* lookAt only sets the rotation — matrixWorld (and the inverse Vector3.project reads) stays
     identity until this is called. The render loop would do it a frame later, which is too late
     for fitTargetsBelowBanner(): it projects immediately and would measure a camera still sitting
     at the origin. */
  camera.updateMatrixWorld(true);
}
/* The title card is an opaque DOM banner pinned across the top, and the two back buildings stand
   tall enough to hide behind it. Rather than shrink the banner or move the buildings, pan the
   camera down — but only by the amount actually missing, or a tall 9:16 frame ends up with a
   band of empty sky where the banner already sat over nothing.

   So: project every reticle with no pan, take the highest one, and pan by the shortfall. The
   projection is orthographic, so pixels and world units are related by one linear factor and a
   single pass is exact. Re-run on resize. Picking is unaffected — the raycaster reads this same
   projection matrix. */
function fitTargetsBelowBanner(){
  if(!buildings.length) return;
  camShift=0; mkCam();
  const W=stageWrap.clientWidth||innerWidth,H=stageWrap.clientHeight||innerHeight;
  const bn=document.querySelector('.board-banner');
  const needPx=(bn?bn.getBoundingClientRect().bottom:0)+TOP_CLEARANCE_PX;
  let topPx=Infinity;
  buildings.forEach(b=>{
    const c=b.cfg;
    const v=new THREE.Vector3(c.x,c.base+c.h+c.top+RETICLE_REACH,c.z).project(camera);
    topPx=Math.min(topPx,(-v.y*0.5+0.5)*H);
  });
  if(topPx<needPx) camShift=(needPx-topPx)*(2*HALF_W/W);
  mkCam();
}
mkCam();
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.outputColorSpace=THREE.LinearSRGBColorSpace;   // r128 wrote linear straight to the canvas
renderer.setPixelRatio(Math.min(2,devicePixelRatio));
renderer.setSize(stageWrap.clientWidth,stageWrap.clientHeight);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
wrapEl.appendChild(renderer.domElement);
/* Re-fit on any box change, not just window resize. Hosted, this page is an iframe the app sizes
   from outside, and it can be resized AFTER the module has already laid out and measured — a
   window 'resize' listener misses that and the camera stays fitted to a stage width that no
   longer exists. Observing the stage and the banner catches every case, including the banner
   re-wrapping when a long rival name arrives. */
function relayout(){
  const W=stageWrap.clientWidth,H=stageWrap.clientHeight;
  if(!W||!H) return;                     // mid-teardown, or not laid out yet
  fitTargetsBelowBanner();
  renderer.setSize(W,H);
}
addEventListener('resize',relayout);
if(window.ResizeObserver){
  const ro=new ResizeObserver(()=>relayout());
  ro.observe(stageWrap);
  ro.observe(document.querySelector('.board-banner'));
}

/* bright sunny day */
scene.add(new THREE.AmbientLight(0xffffff,0.42*LIGHT_SCALE));
scene.add(new THREE.HemisphereLight(0xbfe3ff,0xc79a5e,0.38*LIGHT_SCALE));
const sun=new THREE.DirectionalLight(0xfff2d8,1.12*LIGHT_SCALE);sun.position.set(-14,34,20);sun.castShadow=true;
sun.shadow.camera.left=-26;sun.shadow.camera.right=26;sun.shadow.camera.top=26;sun.shadow.camera.bottom=-26;
sun.shadow.mapSize.set(2048,2048);sun.shadow.bias=-0.0004;scene.add(sun);

const M=(c,o={})=>new THREE.MeshLambertMaterial({color:c,...o});
function box(w,h,d,c,x,y,z,p=scene){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),M(c));
  m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;p.add(m);return m;}
function cyl(rt,rb,h,c,x,y,z,p=scene,s=14){const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,s),M(c));
  m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;p.add(m);return m;}

/* ---- GROUND: huge, extends past every edge except the far horizon ---- */
const GROUND_FAR=-34;                       // where ground stops → horizon line near frame top
box(120,1,90,0xd2a763,0,-0.5,11);           // pale plaza concrete, reaches z=-34 … +56
/* lawn patches */
[[-14,-6,10,12,0x76c24a],[15,-14,12,14,0x69b83f],[-16,14,12,12,0x76c24a],[16,10,10,12,0x69b83f],
 [-4,26,14,10,0x76c24a],[8,30,12,10,0x69b83f]].forEach(([x,z,w,d,c])=>{box(w,0.12,d,c,x,0.06,z);});
/* roads: one across, one down toward camera */

function updateNPC(o,dt,t){
  if(o.state==='pause'){o.timer-=dt;if(o.timer<=0){o.target=rnd(wps).clone();o.state='walk';}return;}
  const dir=o.target.clone().sub(o.m.position);dir.y=0;
  if(dir.length()<0.3){o.state='pause';o.timer=0.6+Math.random()*2.2;o.m.position.y=0;return;}
  dir.normalize();o.m.position.addScaledVector(dir,o.speed*dt);
  o.m.rotation.y=Math.atan2(dir.x,dir.z);
  o.m.position.y=Math.abs(Math.sin(t*7+o.phase))*0.05;
  const a=Math.sin(t*10+o.phase)*0.5;o.m.userData.legs[0].rotation.x=a;o.m.userData.legs[1].rotation.x=-a;
}

  d.style.left=((v.x*.5+.5)*W)+'px';d.style.top=((-v.y*.5+.5)*H)+'px';stageWrap.appendChild(d);setTimeout(()=>d.remove(),1500);}

/* ================= game logic =================
   The ONLY change from the standalone demo: the payout and the outcome arrive from the host and
   are never drawn here. currentCheck is set by applyHostSpec(), not by a random pick. */
const RIVAL_NAMES=['Meghan','PeterCrouch108','Valadon','sofia_r','DiegoM','TheReelQueen','marcopolo22','LunaDrama'];
const RIVAL_PICS=['🧑‍🎤','👩‍🎤','🧔','👩‍🦰','🕵️','💁‍♀️','🧑‍🦱','👨‍🎨'];
let rival,busy=true,resolved=false,currentCheck=0,pending=null,blocked=false;
/* every pending timeout, so an idle auto-play or a host teardown never leaves one firing */
const shots=[];
function shot(ms,fn){ shots.push(setTimeout(fn,ms)); }
function clearShots(){ shots.forEach(clearTimeout); shots.length=0; }
let idleTimer=null;
/* Choosing the spot is the whole game — it is never done for the player, however long they take.
   The only caller that sets idleMs is auto-roll, which has nobody to click for it; a human gets 0
   and the round simply waits. (The host still holds cfg.bonusMaxMs over the whole thing so a
   walked-away session cannot soft-lock the board, but that is a backstop, not a pick timer.) */
function armIdle(){
  clearTimeout(idleTimer);
  if(!SPEC.idleMs) return;
  idleTimer=setTimeout(()=>{ if(!resolved) pick(Math.floor(Math.random()*buildings.length)); },SPEC.idleMs);
}

function preRoll(){
  /* Hosted: the engine already decided and already paid. Demo: draw something to look at. */
  if(demoMode){
    blocked=Math.random()<0.5;
    currentCheck=blocked?DEMO_CONSOLATION:rnd(DEMO_CHECKS);
  }else{
    blocked=SPEC.outcome==="blocked";
    currentCheck=SPEC.amount;
  }
}

function newPitch(){
  $('tray').classList.remove('show','blocked');resolved=false;busy=true;
  /* hasNet is the VISUAL of the outcome, not its cause — the outcome is already decided. */
  rival={name:rnd(RIVAL_NAMES),pic:rnd(RIVAL_PICS),hasNet:blocked};
  $('whoseName').textContent=rival.name+"'s Town";$('whosePic').firstChild.textContent=rival.pic;
  $('promptRival').textContent=rival.name;
  $('whoseNets').textContent='🕸️'+(rival.hasNet?1:0);$('whoseNets').style.opacity=rival.hasNet?1:.3;
  $('banner').textContent='Steal the spotlight before '+rival.name+' gets snapped!';
  /* A long rival name wraps the title card onto another line, so re-measure: the banner's height
     is what the camera pan is fitted to. */
  fitTargetsBelowBanner();
  buildings.forEach(b=>{b.g.scale.setScalar(1);b.target.visible=true;});
  if(netGroup){scene.remove(netGroup);netGroup=null;}
  if(spotCone){scene.remove(spotCone);spotCone=null;}limo.visible=false;photog.visible=false;clearPolaroids();
  $('prompt').style.visibility='visible';
  const bn=$('banner');bn.classList.remove('on');void bn.offsetWidth;bn.classList.add('on');S.big();
  setTimeout(()=>{busy=false;armIdle();},900);
}
function pick(idx){
  if(busy||resolved)return;resolved=true;busy=true;clearTimeout(idleTimer);S.tap();S.knock();
  $('prompt').style.visibility='hidden';
  const b=buildings[idx];const cfg=b.cfg,x=cfg.x,gy=cfg.base,z=cfg.z;
  buildings.forEach(o=>{o.target.visible=false;if(o.idx!==idx)anims.push({t:0,dur:.4,step(dt,k){o.g.scale.setScalar(1-k*0.14);}});});
  anims.push({t:0,dur:.5,step(dt,k){b.g.scale.setScalar(1+Math.sin(k*Math.PI)*0.12);}});
  flash(.25);
  shot(820,()=>{
    if(blocked){
      netGroup=makeNet();netGroup.position.set(x,gy+cfg.h*0.6+1,z+cfg.d/2+0.8);netGroup.scale.setScalar(0.1);scene.add(netGroup);
      anims.push({t:0,dur:.5,step(dt,k){netGroup.scale.setScalar(0.1+k*0.9);netGroup.rotation.z=k*0.4;}});
      shakeScreen();S.block();label3d(x,gy+cfg.h+cfg.top+2.6,z,'Already snapped! 📸','net');
      shot(780,()=>showResult(false));
    } else {
      coinBurst(x,gy+cfg.h+cfg.top*0.5+0.6,z+1,18);label3d(x,gy+cfg.h+cfg.top+2.0,z,'+'+fmt(currentCheck)+' 🪙');
      shakeScreen();S.win();
      spotlightOn(x,gy+cfg.h+cfg.top,z);
      paparazziShow(x,gy,z,cfg);
      shot(1900,()=>showResult(true));
    }
  });
}
function showResult(won){
  const tray=$('tray');$('trayPic').firstChild.textContent=rival.pic;
  if(won){tray.classList.remove('blocked');$('trayBadge').textContent='😭';
    $('trayLine').innerHTML=`You stole the spotlight! 📸<br>You pushed <b>${rival.name}</b> out of the frame`;
  }else{tray.classList.add('blocked');$('trayBadge').textContent='📸';
    $('trayLine').innerHTML=`<b>${rival.name}</b> was already center frame<br>you only got a <b>background cameo</b>`;}
  $('trayAmt').textContent=fmt(currentCheck);pending={amt:currentCheck};
  tray.classList.add('show');
  /* Don't sit on the tray forever either — half the pick window is plenty to read it. */
  shot(Math.max(3000,SPEC.trayMs*0.5),()=>{ if(pending) collect(); });
}
function collect(){
  if(!pending)return;const amt=pending.amt;pending=null;clearShots();clearTimeout(idleTimer);
  const COUNT_MS=700;
  const start=coins,target=coins+amt,t0=performance.now();
  (function up(t){const k=Math.min(1,(t-t0)/COUNT_MS);coins=Math.round(start+(target-start)*(1-Math.pow(1-k,3)));
    setCoinsDisplay(coins);if(k<1)requestAnimationFrame(up);else{coins=target;setCoinsDisplay(coins);}})(t0);
  bumpCoins();clearPolaroids();$('tray').classList.remove('show');
  /* Hosted, the round IS the bonus — hand the roll loop back. The demo keeps playing.
     The delay is longer than the count-up above on purpose: reporting done tears this frame down
     and the rAF driving the tween dies with it, freezing the balance mid-count. */
  if(demoMode) setTimeout(()=>{preRoll();newPitch();},700);
  else setTimeout(()=>sendDone(amt),COUNT_MS+220);
}
const ray=new THREE.Raycaster(),ptr=new THREE.Vector2();
renderer.domElement.addEventListener('pointerdown',ev=>{
  if(busy||resolved)return;const r=stageWrap.getBoundingClientRect();
  ptr.x=((ev.clientX-r.left)/r.width)*2-1;ptr.y=-((ev.clientY-r.top)/r.height)*2+1;
  ray.setFromCamera(ptr,camera);const hits=ray.intersectObjects(buildings.map(b=>b.hit),false);
  if(hits.length)pick(hits[0].object.userData.idx);
});
$('collectBtn').addEventListener('click',collect);
$('switchBtn').addEventListener('click',()=>{if(resolved)return;preRoll();newPitch();});

const clock=new THREE.Clock();
function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
  buildings.forEach(b=>{if(b.target.visible){
    b.target.position.y=b.cfg.base+b.cfg.h+b.cfg.top+1.4+Math.sin(t*2+b.phase)*0.12;
    b.target.scale.setScalar(1+Math.sin(t*3+b.phase)*0.09);
    b.target.quaternion.copy(camera.quaternion);b.target.rotateZ(t*1.2);}});
  npcs.forEach(o=>updateNPC(o,dt,t));
  clouds.forEach(c=>{c.g.position.x+=c.sp*dt;if(c.g.position.x>30)c.g.position.x=-30;});
  if(netGroup&&netGroup.children[1])netGroup.children[1].rotation.z=t;
  for(let i=anims.length-1;i>=0;i--){const a=anims[i];a.t+=dt;const k=Math.min(1,a.t/a.dur);a.step(dt,k);if(k>=1){a.end&&a.end();anims.splice(i,1);}}
  renderer.render(scene,camera);}

/* private-jet loading screen, then the first pitch */
function runLoader(ms){
  const dests=['Fueling the jet…','Following the flashbulbs…','Landing at the shoot…'];
  let i=0;const dl=$('loaderDest');
  const step=Math.max(200,ms/dests.length);
  const iv=setInterval(()=>{i++;if(i<dests.length)dl.textContent=dests[i];},step);
  setTimeout(()=>{
    clearInterval(iv);
    const l=$('loader');l.classList.add('hide');
    setTimeout(()=>{l.style.display='none';},600);
    preRoll();newPitch();
  },ms);
}

/* ---- start ----
   Hosted: hold on the loader until the engine's spec arrives, so the payout is known before a
   single frame of the round is drawn. Standalone: start straight away in demo mode. */
let started=false;
function start(){ if(started) return; started=true; loop(); runLoader(SPEC.loadMs); }
if(HOST){
  document.body.classList.add('hosted');
  addEventListener('message',e=>{
    if(e.origin!==location.origin||e.source!==parent) return;
    const m=e.data||{};
    if(m.type!=="bonus:open"||started) return;
    SPEC={...SPEC,...m};
    demoMode=false;
    coins=SPEC.coins;setCoinsDisplay(coins);
    start();
  });
  parent.postMessage({type:"bonus:ready"},location.origin);
  /* If the host never answers, don't leave a dead screen: fall back to the demo. The host has
     its own guard for this and pays out through the Collect popup, so this is only about not
     showing a frozen jet if the two ever get out of step. */
  setTimeout(()=>{ if(!started){ demoMode=true; setCoinsDisplay(coins); start(); } },4000);
}else{
  setCoinsDisplay(coins);
  start();
}
</script>
</body>
