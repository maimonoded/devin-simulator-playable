<!doctype html><meta charset="utf-8"><title>The estate, level by level</title>
<!-- THE BASE IS THE WHOLE REASON THIS PAGE CAN LIVE IN tools/.

     Estate3D fetches its models and paintings by document-relative path — "assets/estate/..." —
     because it was written for index.html at the repository root. Served from /tools/ those
     resolve to /tools/assets/... and 404, and the estate silently falls back to a painting whose
     art is also missing: an empty gilt frame, which looks like a rendering bug rather than a
     path one. Re-basing the document to the root makes every relative URL on the page behave
     exactly as it does in the game, so the tool loads the same files the board loads.

     It also means the script srcs below are root-relative rather than "../" — with a base set,
     "../" would climb out of the repository. -->
<base href="../">
<!-- Step the Status track and watch the estate exactly as the board draws it.

     WHY THIS IS NOT A MOCK-UP. It imports the SHIPPED js/ui/estate3d.js and loads the real
     ESTATE_TIERS, the real Status and the real Economy curve, under a camera and a light rig
     copied from js/ui/board3d.js. So the building, its fit, its lamp, its plaque and its fog are
     the ones the game renders — not a second implementation that can drift away from them. The
     only things stubbed are the parts of Status that reach into the collection (Cards, Clues,
     Boxes), because a preview has no run to read from; the stub exists purely so a level can be
     dialled to an exact number of points.

     What is deliberately NOT here is the board: no ring, no tiles, no token, just the deck the
     estate stands on. This answers "what does tier 4 look like, and what happens between 19 and
     20", and putting forty tiles round it would only make that harder to see.

       python3 serve.py
       http://localhost:8125/tools/estate-levels.html
       http://localhost:8125/tools/estate-levels.html?lv=20&fog=6000

     + and - step one level. The fog fires on its own whenever a step crosses a tier boundary,
     because Estate3D decides that, not this page. -->
<style>
  :root{ --ink:#e8ecff; --gold:#ffcb5c; --panel:#141a3d; }
  *{ box-sizing:border-box }
  body{ margin:0; background:#0b1024; color:var(--ink);
        font:14px/1.45 "Segoe UI", system-ui, -apple-system, sans-serif; }
  /* The canvas gets its own band and the controls sit BELOW it rather than over it. Floating the
     bar looked tidier and covered the plaque — which is half of what there is to look at. */
  #stage{ position:relative; width:100vw; height:calc(100vh - 96px); }
  canvas{ display:block }
  .bar{ height:96px; display:flex; gap:10px; align-items:center; justify-content:center;
        background:#0b1024; border-top:1px solid #ffcb5c33; padding:0 14px; }
  button{ font:700 20px/1 system-ui; color:#0b1024; background:var(--gold); border:0;
          border-radius:10px; width:44px; height:40px; cursor:pointer }
  button:disabled{ opacity:.3; cursor:default }
  button.alt{ background:#2b3570; color:var(--ink); width:auto; padding:0 12px; font-size:13px }
  .read{ min-width:210px; text-align:center }
  .read .lv{ font-weight:800; font-size:19px; color:var(--gold) }
  .read .tier{ font-size:13px; opacity:.85 }
  /* The small change, in numbers. The lamp ramp is the thing that moves between one level and
     the next, and at a glance it is easy to mistake for nothing happening — so the tool says
     what it is rather than leaving you to squint at two screenshots. */
  .read .warm{ font-size:11.5px; opacity:.7; font-variant-numeric:tabular-nums }
  .hint{ position:absolute; top:16px; left:50%; transform:translateX(-50%); font-size:12.5px;
         opacity:.6 }
  #fogflag{ position:absolute; top:16px; right:18px; font-size:12.5px; color:var(--gold);
            opacity:0; transition:opacity .18s }
  #fogflag.on{ opacity:1 }
  label{ font-size:12.5px; opacity:.8; display:flex; gap:6px; align-items:center }
  input[type=range]{ width:120px }
</style>

<div id="stage">
  <div class="hint">the shipped <code>Estate3D</code>, under the board's camera and lights</div>
  <div id="fogflag">fog</div>
</div>
  <div class="bar">
    <button id="down" title="one level down">−</button>
    <div class="read">
      <div class="lv" id="lv">LV 1</div>
      <div class="tier" id="tier">–</div>
      <div class="warm" id="warm">–</div>
    </div>
    <button id="up" title="one level up">+</button>
    <button class="alt" id="prevTier" title="previous tier">◀ tier</button>
    <button class="alt" id="nextTier" title="next tier">tier ▶</button>
    <label>fog <input id="fogms" type="range" min="0" max="6000" step="250"><span id="fogval"></span></label>
    <label><input id="phone" type="checkbox"> 9:16 fit</label>
  </div>

<!-- The real content and the real model, in index.html's order. -->
<script>
  /* Status derives its points from the collection, and a preview has no run. These stubs are the
     whole of the pretence: statusPoints is the dial the + and - buttons turn, so a level can be
     set to an exact number of points rather than to the nearest episode's worth.

     js/episodes.js is loaded for real rather than stubbed, because Status reaches it for the
     trophy list. With no episodes/NNN.js registered it reports none, which is what a preview
     wants — and a real one cannot drift from the game the way a hand-written stub would. */
  let __pts = 0;
  const Cards = { statusPoints: () => __pts };
  const Clues = { grant: () => null };
  const Boxes = { tier: () => true };
  let state = { epsWatched: 0, predWins: 0, seasonFrom: 0, setsDone: 0, cards: {}, trophies: [] };
</script>
<script src="./js/util.js"></script>
<script src="./js/config.js"></script>
<script src="./js/economy.js"></script>
<script src="./js/episodes.js"></script>
<script src="./assets/status/status.js"></script>
<script src="./assets/estate/estate.js"></script>
<script src="./js/status.js"></script>

<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
<script type="module">
import * as THREE from "three";
import { Estate3D } from "./js/ui/estate3d.js";

const Q = new URLSearchParams(location.search);
/* Mirrors ENV_CAM and the light rig in js/ui/board3d.js. Change those, change these. */
const CAM = { az: 45, el: 38 };
const stage = document.getElementById("stage");

const scene = new THREE.Scene();
scene.add(new THREE.AmbientLight(0xffffff, 0.95));
const key = new THREE.DirectionalLight(0xffffff, 1.9); key.position.set(12, 24, 16); scene.add(key);
const rim = new THREE.DirectionalLight(0x8b6dff, 0.7); rim.position.set(-8, 5, -6); scene.add(rim);
scene.add(new THREE.HemisphereLight(0x9fc4ff, 0x14204a, 0.45));
/* The deck the estate stands on, at the board's own surface height. No ring: see the note above. */
const deck = new THREE.Mesh(new THREE.PlaneGeometry(60, 60),
  new THREE.MeshStandardMaterial({ color: 0xd8cbb0 }));
deck.rotation.x = -Math.PI / 2; deck.position.y = 0.13; scene.add(deck);

const ren = new THREE.WebGLRenderer({ antialias: true });
ren.setPixelRatio(Math.min(2, devicePixelRatio));
ren.outputColorSpace = THREE.SRGBColorSpace;
stage.appendChild(ren.domElement);

const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 200);
const az = CAM.az * Math.PI / 180, el = CAM.el * Math.PI / 180;
/* Aimed low enough that the sign standing in FRONT of the plot is in frame — it hangs below the
   house on screen, and framing on the building alone crops the thing that carries the level. */
const AIM = new THREE.Vector3(0, 1.05, 0);
cam.position.set(Math.cos(el) * Math.sin(az), Math.sin(el), Math.cos(el) * Math.cos(az))
   .multiplyScalar(40).add(AIM);
cam.lookAt(AIM);

function resize(){
  const w = stage.clientWidth, h = stage.clientHeight;
  ren.setSize(w, h);
  const halfH = 3.9, halfW = halfH * w / h;
  cam.left = -halfW; cam.right = halfW; cam.top = halfH; cam.bottom = -halfH;
  cam.updateProjectionMatrix();
}
addEventListener("resize", resize); resize();

Estate3D.init(scene);

/* ---- the dial ---- */
const $ = id => document.getElementById(id);
let lv = Math.max(1, Math.min(Status.maxLevel(), +Q.get("lv") || 1));

/* Land exactly on the level's opening threshold, so the plaque reads 0 / <cost>. */
function setLevel(next){
  lv = Math.max(1, Math.min(Status.maxLevel(), next));
  __pts = Status.levelAt(lv);
  Estate3D.sync();
  paint();
}
function paint(){
  const t = ESTATE_TIERS.filter(x => lv >= x.at).pop();
  $("lv").textContent = `LV ${lv}`;
  $("tier").textContent = `${ESTATE_TIERS.indexOf(t) + 1}/6 · ${t.name}`;
  $("down").disabled = lv <= 1;
  $("up").disabled = lv >= Status.maxLevel();
}

/* THE SMALL CHANGE, SPELLED OUT — and read off the SCENE every frame rather than off the click.

   Six buildings cover thirty levels, so most steps change the LIGHT rather than the house: the
   lamp in the rooms ramps across a band and resets at the next. Sampling it when the button is
   pressed reports the wrong number for the length of a cloud, because a tier change deliberately
   does not touch the building until the fog is at its thickest — the readout would say the new
   tier's lamp while the old house was still standing, which is exactly the lie the fog exists to
   avoid telling. */
function paintWarm(){
  const { step, span } = Estate3D.tierStep(lv);
  const est = scene.getObjectByName("estate");
  const lamp = est && est.children.find(c => c.isPointLight);
  $("warm").textContent =
    `step ${step + 1}/${span} in band · lamp ${lamp ? lamp.intensity.toFixed(2) : "–"}`;
}
$("down").onclick = () => setLevel(lv - 1);
$("up").onclick   = () => setLevel(lv + 1);
$("prevTier").onclick = () => {
  const opens = ESTATE_TIERS.map(t => t.at).filter(a => a < lv);
  setLevel(opens.length ? opens[opens.length - 1] : 1);
};
$("nextTier").onclick = () => {
  const next = ESTATE_TIERS.map(t => t.at).find(a => a > lv);
  setLevel(next || Status.maxLevel());
};
addEventListener("keydown", e => {
  if (e.key === "ArrowUp"   || e.key === "+" || e.key === "=") { $("up").click();   e.preventDefault(); }
  if (e.key === "ArrowDown" || e.key === "-")                  { $("down").click(); e.preventDefault(); }
});

cfg.estateFogMs = +Q.get("fog") || cfg.estateFogMs;
const fogms = $("fogms");
fogms.value = cfg.estateFogMs;
$("fogval").textContent = cfg.estateFogMs + "ms";
fogms.oninput = () => {
  cfg.estateFogMs = +fogms.value;
  cfg.estateFog = cfg.estateFogMs > 0 ? 1 : 0;
  $("fogval").textContent = cfg.estateFogMs + "ms";
};
$("phone").onchange = e => { cfg.phoneView = e.target.checked ? 1 : 0; Estate3D.sync(); };

setLevel(lv);

/* ---- the loop ---- */
const flag = $("fogflag");
(function loop(){
  requestAnimationFrame(loop);
  Estate3D.tick();
  paintWarm();
  flag.classList.toggle("on", !!scene.getObjectByName("estatefog"));
  ren.render(scene, cam);
})();
</script>
